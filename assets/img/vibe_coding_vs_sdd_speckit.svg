<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>
  
  <!-- Left Side: Vibe Coding (Chaos) -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fad0c4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="400" height="400" fill="url(#grad1)" opacity="0.1"/>
  
  <!-- Chaos Lines -->
  <path d="M50 350 Q 100 50 200 200 T 350 100" stroke="#ff6b6b" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M30 300 Q 150 350 250 150 T 380 320" stroke="#ee5253" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M80 100 Q 200 50 300 350" stroke="#ff9f43" stroke-width="2" fill="none" opacity="0.4"/>
  
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ee5253" text-anchor="middle">Vibe Coding</text>
  <text x="200" y="220" font-family="Arial, sans-serif" font-size="16" fill="#576574" text-anchor="middle">Hope-driven &amp; Spaghetti</text>

  <!-- Right Side: SDD (Order) -->
  <rect x="400" y="0" width="400" height="400" fill="url(#grad2)" opacity="0.1"/>
  
  <!-- Grid Lines -->
  <g stroke="#4facfe" stroke-width="0.5" opacity="0.3">
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="550" y1="0" x2="550" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="650" y1="0" x2="650" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="400" y1="50" x2="800" y2="50" />
    <line x1="400" y1="100" x2="800" y2="100" />
    <line x1="400" y1="150" x2="800" y2="150" />
    <line x1="400" y1="200" x2="800" y2="200" />
    <line x1="400" y1="250" x2="800" y2="250" />
    <line x1="400" y1="300" x2="800" y2="300" />
    <line x1="400" y1="350" x2="800" y2="350" />
  </g>
  
  <!-- Structured Blueprint -->
  <rect x="500" y="100" width="200" height="150" rx="10" stroke="#0097e6" stroke-width="3" fill="none"/>
  <line x1="500" y1="140" x2="700" y2="140" stroke="#0097e6" stroke-width="1"/>
  <circle cx="530" cy="120" r="5" fill="#0097e6"/>
  <circle cx="550" cy="120" r="5" fill="#0097e6"/>
  <circle cx="570" cy="120" r="5" fill="#0097e6"/>

  <text x="600" y="310" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0097e6" text-anchor="middle">SDD + SpecKit</text>
  <text x="600" y="345" font-family="Arial, sans-serif" font-size="16" fill="#576574" text-anchor="middle">Design-driven &amp; Precision</text>

  <!-- VS Bubble -->
  <circle cx="400" cy="200" r="40" fill="#2f3542" stroke="white" stroke-width="4"/>
  <text x="400" y="212" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">VS</text>

  <!-- SpecKit Logo Marker -->
  <path d="M550 170 L580 200 L650 130" stroke="#2ed573" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
